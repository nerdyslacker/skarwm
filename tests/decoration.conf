# Minimal configuration used for manual and nested-X decoration checks.

[general]
mod_key = super

[window]
outer_gap = 8
inner_gap = 8
border_width = 2

[animation]
enabled = false

[window.decoration]
enabled = true
titlebar_height = 20
border_width = 1
resize_hit_width = 4
show_title = true
color_source = explicit
active_background = #313244
inactive_background = #1E1E2E
active_foreground = #FFFFFF
inactive_foreground = #A6ADC8
active_border = #89B4FA
inactive_border = #45475A

[workspace.3]
layout = dwindle

[bind]
"mod + Return" = xterm

[call]
"mod + Shift + q" = close
"mod + grave" = scratchpad_toggle 1

[rule.no-decoration]
class = NoDecoration
decorate = false
