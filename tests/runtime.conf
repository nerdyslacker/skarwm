[general]
mod_key = super

[window]
outer_gap = 8
inner_gap = 8
border_width = 2
corner_radius = 0
focus_follows_mouse = true

[window.border]
normal = #504D47
selected = #FCE8C3

[window.decoration]
enabled = false
titlebar_height = 20
border_width = 1
resize_hit_width = 4
show_title = true
color_source = active-border

[scroll]
preview_hover_delay_ms = 250

[animation]
enabled = false
duration_ms = 180
fps = 60
easing = ease_out_cubic

[bar]
enabled = false
position = top
height = 26
font = monospace
font_size = 11
font_weight = normal
foreground = #E6E6E6
background = #1E1E2E
tag_count = 8

[bar.tag]
foreground = #262626
background = #5F87AF

[bar.block]
foreground = #262626
background = #AF5F5F

[bar.block.workspaces]
type = workspaces
position = left
foreground = _
background = #445566

[bar.block.clock]
type = script
position = right
icon = 󰃭
interval = 1
timeout = 1
foreground = #778899
background = #AABBCC
command = date +%H:%M:%S

[bind]
"mod + Return" = true

[call]
"mod + Shift + r" = reload_config
"mod + h" = focusleft

[workspace.bindings]
"mod + 3" = view 3
"mod + Shift + 3" = tag 3

[workspace.3]
layout = dwindle
icon = 󰆍
name = Code

[rule.terminal]
class = XTerm
floating = true
