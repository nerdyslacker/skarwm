[window]
outer_gap = 8
inner_gap = 8
border_width = 2
corner_radius = 0
focus_follows_mouse = true

[window.border]
normal = #504D47
selected = #FCE8C3

[window.decoration]
enabled = false
titlebar_height = 20
border_width = 1
resize_hit_width = 4
show_title = true
color_source = active-border

# Explicit decoration palette, used when color_source = explicit.
accent = #89B4FA
active_background = #313244
inactive_background = #1E1E2E
active_foreground = #FFFFFF
inactive_foreground = #A6ADC8
active_border = #89B4FA
inactive_border = #45475A

[scroll]
preview_hover_delay_ms = 250
