[bar]
enabled = false
position = top
height = 26
font = "JetBrainsMono Nerd Font"
font_size = 12
font_weight = normal
foreground = #FCE8C3
background = #121110
tag_count = 12

[bar.tag]
foreground = #0E0D0C
background = #917E6B

[bar.block]
foreground = #0E0D0C
background = #C5B088

# Optional buttons: uncomment a complete section to enable it.
# [bar.block.launcher]
# type = button
# position = left
# label = 󰀻
# foreground = #0E0D0C
# background = #C5B088
# command = rofi -show drun

# Every named block may override these colors. Omit a property to inherit it.
[bar.block.workspaces]
type = workspaces
position = left

[bar.block.layout]
type = layout
position = left
foreground = #0E0D0C
background = #C5B088

[bar.block.title]
type = title
position = center
background = #C5B088

[bar.block.clock]
type = script
position = center
icon = 󰃭
interval = 1
timeout = 1
foreground = #0E0D0C
background = #C5B088
command = date '+%a, %b %d - %H:%M:%S'

[bar.block.memory]
type = script
position = right
icon = 󰍛
interval = 2
timeout = 1
foreground = #0E0D0C
background = #C5B088
command = free -b | awk '/Mem:/ {print int($3/107374182.4)/10 "/" int($2/107374182.4)/10 "GB"}'

[bar.block.cpu]
type = script
position = right
icon = 
interval = 2
timeout = 3
foreground = #0E0D0C
background = #C5B088
command = grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)} END {print int(usage+0.5) "%"}'

[bar.block.disk]
type = script
position = right
icon = 󰋊
interval = 30
timeout = 1
foreground = #0E0D0C
background = #C5B088
command = df -P / | awk 'NR==2 {print $5}'

[bar.block.bluetooth]
type = bluetooth
position = right
icon = 󰂯
foreground = #0E0D0C
background = #C5B088

[bar.block.network]
type = network
position = right
icon = 󰤨
foreground = #0E0D0C
background = #C5B088

[bar.block.audio]
type = audio
position = right
icon = 󰕾
foreground = #0E0D0C
background = #C5B088
command = pavucontrol

[bar.block.battery]
type = script
position = right
icon = 󰁹
interval = 10
timeout = 1
foreground = #0E0D0C
background = #C5B088
command = cat /sys/class/power_supply/BAT0/capacity; printf '%%'

[bar.block.systray]
type = systray
position = right
foreground = #0E0D0C
background = #C5B088

