[bar]
enabled = true
position = top
height = 26
font = "JetBrainsMono Nerd Font"
font_size = 12
font_weight = normal
foreground = #FCE8C3
background = #121110
tag_count = 12

[bar.tag]
foreground = #0E0D0C
background = #917E6B

[bar.block]
foreground = #0E0D0C
background = #C5B088

[bar.blocks.workspaces]
type = workspaces
position = left

[bar.blocks.layout]
type = layout
position = left

[bar.blocks.title]
type = title
position = center

[bar.blocks.clock]
type = script
position = center
icon = 󰃭
interval = 1
timeout = 1
command = date '+%a, %b %d - %H:%M:%S'

[bar.blocks.memory]
type = script
position = right
icon = 󰍛
interval = 2
timeout = 1
command = free -b | awk '/Mem:/ {print int($3/107374182.4)/10 "/" int($2/107374182.4)/10 "GB"}'

[bar.blocks.cpu]
type = script
position = right
icon = 
interval = 2
timeout = 3
command = grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)} END {print int(usage+0.5) "%"}'

[bar.blocks.disk]
type = script
position = right
icon = 󰋊
interval = 30
timeout = 1
command = df -P / | awk 'NR==2 {print $5}'

[bar.blocks.bluetooth]
type = bluetooth
position = right
icon = 󰂯

[bar.blocks.network]
type = network
position = right
icon = 󰤨

[bar.blocks.audio]
type = audio
position = right
icon = 󰕾
command = pavucontrol

[bar.blocks.battery]
type = script
position = right
icon = 󰁹
interval = 10
timeout = 1
command = cat /sys/class/power_supply/BAT0/capacity; printf '%%'

[bar.blocks.systray]
type = systray
position = right
