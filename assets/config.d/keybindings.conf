[bind]
"mod + Return" = st

[call]
"mod + h" = focusleft
"mod + j" = focusdown
"mod + k" = focusup
"mod + l" = focusright
"mod + Control + h" = resizeleft
"mod + Control + j" = resizedown
"mod + Control + k" = resizeup
"mod + Control + l" = resizeright
"mod + Shift + h" = moveleft
"mod + Shift + j" = movedown
"mod + Shift + k" = moveup
"mod + Shift + l" = moveright
"mod + space" = togglefloating
"mod + Shift + space" = togglealwaysontop
"mod + f" = togglefullscreen
"mod + t" = toggle_tabbed
"mod + g" = layout_next
"mod + Control + Alt + h" = show_bindings
"mod + Control + Alt + t" = show_datetime
"mod + Control + Alt + b" = show_battery
"mod + Control + r" = reminder_new
"mod + Control + Alt + r" = reminder_show_all
"mod + Control + Shift + r" = reminder_clear_all
"mod + Shift + q" = close_window
"mod + Shift + r" = reload_config
"mod + grave" = scratchpad_toggle 1
"mod + Shift + grave" = scratchpad_toggle_float 2
"mod + Control + grave" = scratchpad_remove 1
"mod + n" = ws_next
"mod + p" = ws_prev
"mod + Control + n" = tag_next
"mod + Control + p" = tag_prev
"mod + comma" = focus_output_prev
"mod + period" = focus_output_next
"mod + Shift + comma" = move_to_output_prev
"mod + Shift + period" = move_to_output_next
"mod + F5" = screen_split_shrink 15
"mod + F6" = screen_split_disable
"mod + F7" = screen_split_enable 75
"mod + F8" = screen_split_grow 15

[workspace.bindings]
"mod + 1" = view 1
"mod + 2" = view 2
"mod + 3" = view 3
"mod + 4" = view 4
"mod + Shift + 1" = tag 1
"mod + Shift + 2" = tag 2
"mod + Shift + 3" = tag 3
"mod + Shift + 4" = tag 4
