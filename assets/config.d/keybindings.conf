[bind]
# Run a shell command. Spawn bindings get an unbound Shift variant for tabs.
"mod + Return" = st
# "mod + Return" = kitty
# "mod + Shift + x" = betterlockscreen -l
# "XF86MonBrightnessUp" = brightnessctl set +5%
# "XF86MonBrightnessDown" = brightnessctl set 5%-
# "XF86AudioRaiseVolume" = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# "XF86AudioLowerVolume" = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# "XF86AudioMute" = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[call]
# Focus a neighboring window.
"mod + h" = focusleft
"mod + j" = focusdown
"mod + k" = focusup
"mod + l" = focusright
# Resize the focused tile: left/up shrink; right/down grow.
"mod + Control + h" = resizeleft
"mod + Control + j" = resizedown
"mod + Control + k" = resizeup
"mod + Control + l" = resizeright
# Move the focused window.
"mod + Shift + h" = moveleft
"mod + Shift + j" = movedown
"mod + Shift + k" = moveup
"mod + Shift + l" = moveright
# Change window state or layout. Tabbed affects the focused column;
# layout_next cycles Scrolling Tile, Vertical Scroller, Dwindle, Monocle, and Floating.
"mod + space" = togglefloating
# Always-on-top floaters use the decoration accent.
"mod + Shift + space" = togglealwaysontop
"mod + f" = togglefullscreen
"mod + t" = toggle_tabbed
"mod + g" = layout_next
# Show built-in notices and binding help.
"mod + Control + Alt + h" = show_bindings
"mod + Control + Alt + t" = show_datetime
"mod + Control + Alt + b" = show_battery
# Create, show, or clear reminders.
"mod + Control + r" = reminder_new
"mod + Control + Alt + r" = reminder_show_all
"mod + Control + Shift + r" = reminder_clear_all
"mod + Shift + q" = close_window
"mod + Shift + r" = reload_config
# The first scratchpad toggle assigns the focused window; later toggles hide or summon it.
# The floating variant also makes the assigned window floating.
"mod + grave" = scratchpad_toggle 1
"mod + Shift + grave" = scratchpad_toggle_float 2
"mod + Control + grave" = scratchpad_remove 1
# Cycle workspaces or move the focused window between them.
"mod + n" = ws_next
"mod + p" = ws_prev
"mod + Control + n" = tag_next
"mod + Control + p" = tag_prev
# Focus another monitor or send the focused window there; RandR order wraps.
"mod + comma" = focus_output_prev
"mod + period" = focus_output_next
"mod + Shift + comma" = move_to_output_prev
"mod + Shift + period" = move_to_output_next
# Focus matching windows; combined criteria use AND and repeated presses cycle matches.
# "mod + a" = focus class URxvt title VIM
# "mod + m" = focus title "Music Player"
# Adjust the active monitor's virtual-screen split: F5/F8 move the boundary,
# F6 disables the split, and F7 enables a 75/25 split.
"mod + F5" = screen_split_shrink 15
"mod + F6" = screen_split_disable
"mod + F7" = screen_split_enable 75
"mod + F8" = screen_split_grow 15

[workspace.bindings]
# View a workspace or send the focused window to it; workspaces are created on demand.
"mod + 1" = view 1
"mod + 2" = view 2
"mod + 3" = view 3
"mod + 4" = view 4
"mod + Shift + 1" = tag 1
"mod + Shift + 2" = tag 2
"mod + Shift + 3" = tag 3
"mod + Shift + 4" = tag 4
